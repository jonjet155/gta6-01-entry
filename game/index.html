<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Heat — an original open-world crime story in the browser: walk the city of Solmar, steal cars, outrun the police and finish three jobs before sunrise.">
<meta name="theme-color" content="#141021">
<meta property="og:title" content="Solmar Heat — An Open-World Crime Story">
<meta property="og:description" content="Three jobs before sunrise in the coastal city of Solmar. Free to play in your browser.">
<title>Solmar Heat — An Open-World Crime Story</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #141021; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* Shown only when JavaScript is off — the game cannot run without it. */
  #nojs { position: fixed; inset: 0; display: grid; place-items: center; color: #e8ecf2;
    font: 16px "Segoe UI", Arial, sans-serif; text-align: center; padding: 24px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Heat: explore the city of Solmar on foot and by car, steal cars, outrun the police and finish three jobs before sunrise"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><div id="nojs">Solmar Heat needs JavaScript to run — please enable it and reload.</div></noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
